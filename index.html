<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- the Bridge before the game, as its docs ask, but deferred: a slow CDN must not hold the first paint.
         A module script is deferred too, so main.ts still runs after this one. -->
    <script defer src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- the title card's mark, four quarters of a crash-test circle: inline, so the boot has no favicon 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2c230'/%3E%3Cpath d='M16 2A14 14 0 0 1 30 16H16zM16 30A14 14 0 0 1 2 16h14z' fill='%2316161a'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2316161a' stroke-width='4'/%3E%3C/svg%3E" />
    <title>Dummy Brawl</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="title" class="overlay">
        <div class="card">
          <div class="logo"><span class="sym"></span>DUMMY<br />BRAWL</div>
          <p>Crash-test dummies. Kick scooters. No rules.</p>
          <button class="primary" disabled>Race</button>
          <div class="sub" id="best"></div>
          <div id="titleinfo"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
